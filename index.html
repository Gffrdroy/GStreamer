<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>GStreamer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --accent-color: #22c55e;
      --accent-alpha: rgba(34, 197, 94, 0.2);
    }

    body { background-color: #0d0d0d; color: #e5e5e5; user-select: none; }

    /* Material 3 Expressive Glassmorphism */
    .m3-glass {
      background: rgba(24, 24, 27, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .m3-pill { border-radius: 9999px; }

    .m3-btn {
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }
    .m3-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }
    .m3-btn:active {
      transform: scale(0.95);
    }

    .accent-bg { background-color: var(--accent-color) !important; }
    .accent-text { color: var(--accent-color) !important; }
    .accent-border { border-color: var(--accent-color) !important; }
    
    video::-webkit-media-controls { display: flex !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans bg-black text-neutral-200">

  <!-- Header -->
  <header class="border-b border-white/10 bg-neutral-900/60 backdrop-blur-md px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div id="brandLogo" class="w-9 h-9 m3-pill accent-bg text-black flex items-center justify-center font-bold shadow-lg">
        <i class="fa-solid fa-play text-sm"></i>
      </div>
      <div>
        <h1 class="text-base font-extrabold text-white">GStreamer</h1>
        <p class="text-[10px] text-neutral-400">Standalone Media Player</p>
      </div>
    </div>

    <!-- M3 Expressive Theme Color Spectrum Picker -->
    <div class="relative flex items-center gap-2">
      <label for="themePicker" title="Customize Accent Color" class="flex items-center gap-2 px-3 py-1.5 m3-glass m3-pill text-xs text-neutral-300 cursor-pointer m3-btn">
        <i class="fa-solid fa-palette accent-text"></i>
        <span>Theme Color</span>
        <input type="color" id="themePicker" value="#22c55e" class="w-0 h-0 opacity-0 absolute" onchange="updateTheme(this.value)">
      </label>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col space-y-4">

    <!-- Search Controls -->
    <div class="m3-glass p-4 rounded-[28px] space-y-3">
      <div class="flex gap-2">
        <input type="text" id="searchQuery" placeholder="Search movies..." onkeydown="if(event.key==='Enter') executeSearch()"
          class="w-full px-5 py-3 m3-pill bg-black/40 border border-white/10 text-xs text-neutral-100 focus:outline-none focus:border-white/30">
        <button onclick="executeSearch()" class="px-6 py-3 accent-bg text-black font-bold text-xs m3-pill flex items-center gap-2 m3-btn">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Search</span>
        </button>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
        <select id="searchLang" class="bg-black/40 border border-white/10 m3-pill px-3 py-2 text-neutral-300">
          <option value="tamil" selected>Tamil</option>
          <option value="hindi">Hindi</option>
          <option value="telugu">Telugu</option>
          <option value="malayalam">Malayalam</option>
          <option value="kannada">Kannada</option>
        </select>
        <select id="searchCategory" class="bg-black/40 border border-white/10 m3-pill px-3 py-2 text-neutral-300">
          <option value="movie" selected>Movies</option>
          <option value="music">Music</option>
        </select>
        <select id="searchSort" class="bg-black/40 border border-white/10 m3-pill px-3 py-2 text-neutral-300">
          <option value="relevance" selected>Relevance</option>
          <option value="recent">Recently Added</option>
        </select>
        <label class="flex items-center gap-2 bg-black/40 border border-white/10 m3-pill px-4 py-2 cursor-pointer">
          <input type="checkbox" id="searchSubtitles" class="accent-border">
          <span class="text-neutral-300 text-[11px]">Subtitles Only</span>
        </label>
      </div>
    </div>

    <!-- URL Input Area -->
    <div class="flex flex-col sm:flex-row gap-2">
      <input type="text" id="streamUrl" placeholder="Paste direct .m3u8 or .mp4 link here..." 
        class="w-full px-5 py-3 rounded-[24px] bg-neutral-900/60 border border-white/10 text-xs font-mono text-neutral-100 focus:outline-none">
      
      <button onclick="loadMediaFromInput()" class="px-6 py-3 accent-bg text-black font-bold text-xs m3-pill whitespace-nowrap m3-btn">
        Play Stream
      </button>
    </div>

    <!-- Video Stage Container -->
    <div id="videoContainer" class="relative w-full aspect-video bg-neutral-950 rounded-[32px] border border-white/10 flex flex-col items-center justify-center overflow-hidden">
      
      <div id="placeholder" class="text-center p-8 space-y-3">
        <div class="w-16 h-16 m3-pill m3-glass flex items-center justify-center mx-auto accent-text">
          <i class="fa-solid fa-film text-2xl"></i>
        </div>
        <p class="text-sm font-semibold text-neutral-200">Paste Media Link Above to Play</p>
      </div>

      <!-- Native Player -->
      <video id="videoElement" class="w-full h-full hidden bg-black object-contain" controls autoplay></video>

      <!-- Floating Expressive 30-Second Controller Pad -->
      <div id="expressiveController" class="absolute bottom-6 m3-glass m3-pill px-6 py-2.5 flex items-center space-x-4 hidden z-20 shadow-2xl">
        <button onclick="skipTime(-30)" title="Rewind 30s" class="w-11 h-11 m3-pill accent-bg text-black font-bold flex items-center justify-center m3-btn">
          <div class="relative flex items-center justify-center">
            <i class="fa-solid fa-rotate-left text-xs"></i>
            <span class="text-[9px] font-bold ml-1">30</span>
          </div>
        </button>

        <span class="text-[11px] font-semibold text-neutral-300 px-2 border-x border-white/10">30s Skip Pad</span>

        <button onclick="skipTime(30)" title="Forward 30s" class="w-11 h-11 m3-pill accent-bg text-black font-bold flex items-center justify-center m3-btn">
          <div class="relative flex items-center justify-center">
            <span class="text-[8px] font-bold mr-1">30</span>
            <i class="fa-solid fa-rotate-right text-xs"></i>
          </div>
        </button>
      </div>

    </div>
  </main>

  <script>
    const video = document.getElementById('videoElement');
    const placeholder = document.getElementById('placeholder');
    const expressiveController = document.getElementById('expressiveController');
    let hls = null;

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const sharedUrl = params.get('url');
      if (sharedUrl) {
        document.getElementById('streamUrl').value = sharedUrl;
        playRawStream(sharedUrl);
      }
    });

    // Keyboard Shortcuts: Left/Right arrows skip 30s
    document.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;

      if (e.code === 'ArrowRight') {
        e.preventDefault();
        skipTime(30);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        skipTime(-30);
      }
    });

    function updateTheme(color) {
      document.documentElement.style.setProperty('--accent-color', color);
    }

    function executeSearch() {
      const query = document.getElementById('searchQuery').value.trim();
      const lang = document.getElementById('searchLang').value;
      const category = document.getElementById('searchCategory').value;
      const sort = document.getElementById('searchSort').value;
      const subtitles = document.getElementById('searchSubtitles').checked;

      let searchUrl = `https://einthusan.tv/movie/results/?lang=${lang}`;
      if (query) searchUrl += `&query=${encodeURIComponent(query)}`;
      if (category) searchUrl += `&cat=${category}`;
      if (sort) searchUrl += `&sort=${sort}`;
      if (subtitles) searchUrl += `&cc=true`;

      window.open(searchUrl, '_blank');
    }

    function loadMediaFromInput() {
      playRawStream(document.getElementById('streamUrl').value.trim());
    }

    function playRawStream(rawUrl) {
      if (!rawUrl) return;
      placeholder.classList.add('hidden');
      video.classList.remove('hidden');
      expressiveController.classList.remove('hidden');

      if (hls) {
        hls.destroy();
        hls = null;
      }

      // Bypass CORS blocking via proxy wrapper
      const proxiedUrl = `https://corsproxy.io/?${encodeURIComponent(rawUrl)}`;

      if (rawUrl.includes('.m3u8')) {
        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(proxiedUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = rawUrl;
          video.play();
        }
      } else {
        video.src = rawUrl;
        video.play().catch(err => console.log("Playback error:", err));
      }
    }

    function skipTime(seconds) {
      if (video) {
        video.currentTime = Math.min(Math.max(video.currentTime + seconds, 0), video.duration || 0);
      }
    }
  </script>
</body>
</html>
