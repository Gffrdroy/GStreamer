<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>GStreamer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0d0d0d; color: #e5e5e5; user-select: none; }
    video::-webkit-media-controls { display: flex !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans bg-black text-neutral-200">

  <!-- Header -->
  <header class="border-b border-neutral-800 bg-neutral-900 px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-green-500 text-black flex items-center justify-center font-bold">
        <i class="fa-solid fa-play text-sm"></i>
      </div>
      <div>
        <h1 class="text-base font-extrabold text-white">GStreamer</h1>
        <p class="text-[10px] text-neutral-400">Standalone Media Player</p>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col space-y-4">

    <!-- Search Controls -->
    <div class="bg-neutral-900 p-3.5 rounded-2xl border border-neutral-800 space-y-3">
      <div class="flex gap-2">
        <input type="text" id="searchQuery" placeholder="Search movies..." onkeydown="if(event.key==='Enter') executeSearch()"
          class="w-full px-4 py-2.5 rounded-xl bg-black border border-neutral-800 text-xs text-neutral-100 focus:outline-none focus:border-green-500">
        <button onclick="executeSearch()" class="px-6 py-2.5 bg-green-500 hover:bg-green-400 text-black font-bold text-xs rounded-xl flex items-center gap-2">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Search</span>
        </button>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
        <select id="searchLang" class="bg-black border border-neutral-800 rounded-lg px-2.5 py-1.5 text-neutral-300">
          <option value="tamil" selected>Tamil</option>
          <option value="hindi">Hindi</option>
          <option value="telugu">Telugu</option>
          <option value="malayalam">Malayalam</option>
          <option value="kannada">Kannada</option>
        </select>
        <select id="searchCategory" class="bg-black border border-neutral-800 rounded-lg px-2.5 py-1.5 text-neutral-300">
          <option value="movie" selected>Movies</option>
          <option value="music">Music</option>
        </select>
        <select id="searchSort" class="bg-black border border-neutral-800 rounded-lg px-2.5 py-1.5 text-neutral-300">
          <option value="relevance" selected>Relevance</option>
          <option value="recent">Recently Added</option>
        </select>
        <label class="flex items-center gap-2 bg-black border border-neutral-800 rounded-lg px-3 py-1.5 cursor-pointer">
          <input type="checkbox" id="searchSubtitles" class="accent-green-500">
          <span class="text-neutral-300 text-[11px]">Subtitles Only</span>
        </label>
      </div>
    </div>

    <!-- URL Input Area -->
    <div class="flex flex-col sm:flex-row gap-2">
      <input type="text" id="streamUrl" placeholder="Paste direct cdn MP4 link or use bookmarklet..." 
        class="w-full px-4 py-3 rounded-xl bg-neutral-900 border border-neutral-800 text-xs font-mono text-neutral-100 focus:outline-none focus:border-green-500">
      
      <button onclick="loadMediaFromInput()" class="px-5 py-3 bg-green-500 hover:bg-green-400 text-black font-bold text-xs rounded-xl whitespace-nowrap">
        Play Stream
      </button>
    </div>

    <!-- Video Stage -->
    <div id="dropZone" class="video-container relative w-full aspect-video bg-neutral-950 rounded-2xl border border-neutral-800 flex items-center justify-center overflow-hidden">

      <div id="placeholder" class="text-center p-8 space-y-3 pointer-events-none">
        <div class="w-16 h-16 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center mx-auto text-green-400">
          <i class="fa-solid fa-film text-2xl"></i>
        </div>
        <p class="text-sm font-semibold text-neutral-200">Drop Stream Link or Use GStreamer Bookmarklet</p>
      </div>

      <!-- Native Video Player with Restricted Referrer Policy -->
      <video id="videoElement" class="w-full h-full hidden bg-black object-contain" controls autoplay referrerpolicy="no-referrer" crossorigin="anonymous"></video>
    </div>
  </main>

  <script>
    const video = document.getElementById('videoElement');
    const placeholder = document.getElementById('placeholder');
    const dropZone = document.getElementById('dropZone');
    let hls = null;

    // Auto-load if parameters are passed from bookmarklet
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const sharedUrl = params.get('url');
      if (sharedUrl) {
        document.getElementById('streamUrl').value = sharedUrl;
        playRawStream(sharedUrl);
      }
    });

    // Drag & Drop
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      let rawUrl = e.dataTransfer.getData('text/plain') || e.dataTransfer.getData('text/uri-list');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        loadLocalFile(e.dataTransfer.files[0]);
        return;
      }
      if (rawUrl) {
        document.getElementById('streamUrl').value = rawUrl;
        playRawStream(rawUrl);
      }
    });

    function executeSearch() {
      const query = document.getElementById('searchQuery').value.trim();
      const lang = document.getElementById('searchLang').value;
      const category = document.getElementById('searchCategory').value;
      const sort = document.getElementById('searchSort').value;
      const subtitles = document.getElementById('searchSubtitles').checked;

      let searchUrl = `https://einthusan.tv/movie/results/?lang=${lang}`;
      if (query) searchUrl += `&query=${encodeURIComponent(query)}`;
      if (category) searchUrl += `&cat=${category}`;
      if (sort) searchUrl += `&sort=${sort}`;
      if (subtitles) searchUrl += `&cc=true`;

      window.open(searchUrl, '_blank');
    }

    function loadMediaFromInput() {
      const raw = document.getElementById('streamUrl').value.trim();
      playRawStream(raw);
    }

    function loadLocalFile(file) {
      placeholder.classList.add('hidden');
      video.classList.remove('hidden');
      if (hls) { hls.destroy(); hls = null; }

      video.src = URL.createObjectURL(file);
      video.play().catch(err => console.log("Playback error:", err));
    }

    function playRawStream(url) {
      if (!url) return;
      placeholder.classList.add('hidden');
      video.classList.remove('hidden');

      if (hls) { hls.destroy(); hls = null; }

      if (url.includes('.m3u8')) {
        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
          video.play();
        }
      } else {
        video.src = url;
        video.play().catch(err => console.log("Play interrupted:", err));
      }
    }
  </script>
</body>
</html>
