<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GStreamer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0d0d0d; color: #e5e5e5; user-select: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans bg-black text-neutral-200">

  <!-- Header -->
  <header class="border-b border-neutral-800 bg-neutral-900 px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-green-500 text-black flex items-center justify-center font-bold">
        <i class="fa-solid fa-play text-sm"></i>
      </div>
      <div>
        <h1 class="text-base font-extrabold text-white">GStreamer</h1>
        <p class="text-[10px] text-neutral-400">Standalone Media Player</p>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col space-y-4">

    <!-- Search Controls -->
    <div class="bg-neutral-900 p-3.5 rounded-2xl border border-neutral-800 space-y-3">
      <div class="flex gap-2">
        <input type="text" id="searchQuery" placeholder="Search movies..." onkeydown="if(event.key==='Enter') executeSearch()"
          class="w-full px-4 py-2.5 rounded-xl bg-black border border-neutral-800 text-xs text-neutral-100 focus:outline-none focus:border-green-500">
        <button onclick="executeSearch()" class="px-6 py-2.5 bg-green-500 hover:bg-green-400 text-black font-bold text-xs rounded-xl flex items-center gap-2">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Search</span>
        </button>
      </div>
    </div>

    <!-- URL Input Area -->
    <div class="flex flex-col sm:flex-row gap-2">
      <input type="text" id="streamUrl" placeholder="Paste Einthusan movie page URL or direct video link..." 
        class="w-full px-4 py-3 rounded-xl bg-neutral-900 border border-neutral-800 text-xs font-mono text-neutral-100 focus:outline-none focus:border-green-500">
      
      <button onclick="loadMediaFromInput()" class="px-5 py-3 bg-green-500 hover:bg-green-400 text-black font-bold text-xs rounded-xl whitespace-nowrap">
        Play Stream
      </button>
    </div>

    <!-- Video Stage -->
    <div id="dropZone" class="video-container relative w-full aspect-video bg-neutral-950 rounded-2xl border border-neutral-800 flex items-center justify-center overflow-hidden">
      <div id="placeholder" class="text-center p-8 space-y-3">
        <div id="statusIcon" class="w-16 h-16 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center mx-auto text-green-400">
          <i class="fa-solid fa-film text-2xl"></i>
        </div>
        <p id="statusText" class="text-sm font-semibold text-neutral-200">Paste Link Above to Start Streaming</p>
      </div>

      <!-- Native Video Player for direct links -->
      <video id="videoElement" class="w-full h-full hidden bg-black object-contain" controls autoplay></video>
      
      <!-- Embedded Player Frame for movie pages -->
      <iframe id="iframeElement" class="w-full h-full hidden border-0" allowfullscreen allow="autoplay"></iframe>
    </div>
  </main>

  <script>
    const video = document.getElementById('videoElement');
    const iframe = document.getElementById('iframeElement');
    const placeholder = document.getElementById('placeholder');

    function executeSearch() {
      const query = document.getElementById('searchQuery').value.trim();
      if (query) window.open(`https://einthusan.tv/movie/results/?lang=tamil&query=${encodeURIComponent(query)}`, '_blank');
    }

    function loadMediaFromInput() {
      const rawUrl = document.getElementById('streamUrl').value.trim();
      if (!rawUrl) return;

      placeholder.classList.add('hidden');

      // Check if link is an Einthusan webpage vs direct media file
      if (rawUrl.includes('einthusan.tv') && !rawUrl.match(/\.(mp4|m3u8)$/i)) {
        video.classList.add('hidden');
        video.pause();
        
        iframe.src = rawUrl;
        iframe.classList.remove('hidden');
      } else {
        iframe.classList.add('hidden');
        iframe.src = '';

        video.src = rawUrl;
        video.classList.remove('hidden');
        video.play().catch(err => console.log("Playback error:", err));
      }
    }
  </script>
</body>
</html>
